name: Deploy P-NEXA to GitHub Pages

on:
  push:
    branches:
      - main
      - feat/phase5-realtime-intelligence
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Monorepo & Web App (with GitHub Pages Base URL)
        env:
          GITHUB_PAGES: 'true'
          NODE_ENV: 'production'
        run: |
          pnpm build

      - name: Enable SPA Routing Fallback (Copy index.html to 404.html)
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
